<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Redirecting…</title>
  <style>
    :root {
      --fg: #111;
      --muted: #555;
      --bg: #fff;
      --ring: #888;
      --dot: #555;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #f2f2f2;
        --muted: #c8c8c8;
        --bg: #0d0f12;
        --ring: #9aa0a6;
        --dot: #9aa0a6;
      }
    }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial;
    }
    .wrap { min-height: 100%; display: grid; place-items: center; padding: 2rem; }
    .card { text-align: center; max-width: 32rem; }
    h2 { margin: 0 0 .5rem; font-weight: 700; }
    p  { margin: .25rem 0; color: var(--muted); }
    a  { color: inherit; text-decoration: underline; }

    /* Spinner loader */
    .spinner {
      width: 40px; height: 40px; margin: 1rem auto 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--ring);
      border-right-color: var(--ring);
      animation: spin .9s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Dots loader */
    .dots { display: none; justify-content: center; margin-top: 1rem; gap: .5rem; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--dot); opacity: .3; animation: blink 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* Button */
    .btn {
      display: inline-block;
      margin-top: 1rem;
      padding: .5rem 1rem;
      border-radius: .5rem;
      background: var(--ring);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background .2s;
    }
    .btn:hover { background: var(--fg); }
  </style>

  <script>
    // ===== CONFIG =====
    const REDIRECT_DELAY = 3000;         // milliseconds (0 = instant)
    const LOADER = "dots";               // "dots" | "spinner"
    // ==================

    const p = location.pathname;
    let target = "/";

    if (p.startsWith('/portfolio/')) {
      target = p.replace('/portfolio', '') + location.search + location.hash;
    }

    let redirectTimeout;
    let seconds = Math.ceil(Math.max(0, REDIRECT_DELAY) / 1000);

    function doRedirect() {
      if (redirectTimeout) clearTimeout(redirectTimeout);
      location.replace(target);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const msg = document.getElementById('redirectMsg');
      const live = document.getElementById('live');
      const manualLink = document.getElementById('manualLink');
      const spinner = document.querySelector('.spinner');
      const dots = document.querySelector('.dots');
      const btn = document.getElementById('homeBtn');

      manualLink.href = target;
      btn.addEventListener('click', doRedirect);

      if (LOADER === "spinner") spinner.style.display = "block";
      else dots.style.display = "flex";

      if (REDIRECT_DELAY > 0) {
        msg.textContent = `You’ll be redirected in ${seconds} second${seconds > 1 ? 's' : ''}…`;
        live.textContent = msg.textContent;

        const interval = setInterval(() => {
          seconds--;
          if (seconds > 0) {
            const text = `You’ll be redirected in ${seconds} second${seconds > 1 ? 's' : ''}…`;
            msg.textContent = text;
            live.textContent = text;
          } else {
            clearInterval(interval);
          }
        }, 1000);

        redirectTimeout = setTimeout(doRedirect, REDIRECT_DELAY);
      } else {
        msg.textContent = "Redirecting…";
        live.textContent = "Redirecting now.";
        doRedirect();
      }
    });
  </script>
</head>
<body>
  <div class="wrap">
    <main class="card" role="main">
      <h2>Oops — that page doesn’t exist.</h2>
      <p id="redirectMsg">Redirecting…</p>
      <p>If nothing happens, <a id="manualLink" href="/">click here</a>.</p>

      <!-- Loaders -->
      <div class="spinner" aria-hidden="true"></div>
      <div class="dots" aria-hidden="true">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>

      <!-- New Button -->
      <button id="homeBtn" class="btn">Return Home Now</button>

      <div id="live" class="sr-only" aria-live="polite"></div>
    </main>
  </div>
</body>
</html>
