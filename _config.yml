title: Danty Cook Portfolio
description: Evidence-backed data analytics, SQL, BI, and machine-learning projects for analyst and analytics engineering roles.

url: "https://www.dantydcook.com"
baseurl: ""

linkedin: "https://www.linkedin.com/in/dantydcook"
github: "https://github.com/DantyDCook"
email: "hireme@dantydcook.com"

permalink: pretty
markdown: kramdown
theme: minima

collections:
  pages:
    output: true
    permalink: /:path/
  projects:
    output: true
    permalink: /projects/:name/
  essays:
    output: true
    permalink: /essays/:name/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-analytics
  - jekyll-sitemap

defaults:
  - scope:
      path: "_projects"
      type: "projects"
    values:
      layout: project
  - scope:
      path: "_essays"
      type: "essays"
    values:
      layout: essay
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: default

analytics:
  provider: google-gtag
  gtag:
    tracking_id: G-51LKT0PS78