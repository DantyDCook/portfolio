---
layout: default
---

<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    {% if page.date %}<p class="post-meta">{{ page.date | date: "%B %d, %Y" }}</p>{% endif %}
  </header>

  {% if page.image %}
    <p><img src="{{ page.image | relative_url }}" alt="{{ page.title }}" style="max-width:100%;height:auto;"></p>
  {% endif %}

  {{ content }}
</article>
